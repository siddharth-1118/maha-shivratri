<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maha Shivratri: The Divine Descent (Cinematic)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            /* Revert to black */
            font-family: 'Cinzel', serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 2s ease-out;
        }

        #start-btn {
            pointer-events: auto;
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 15px 40px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.5s;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        #start-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transform: scale(1.1);
        }

        .fade-out {
            opacity: 0;
            pointer-events: none !important;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, black 100%);
            z-index: 5;
            pointer-events: none;
        }

        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        /* Video is rendered via WebGL Texture now. Hide DOM element. */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            z-index: -100;
            pointer-events: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <video id="bg-video" loop muted playsinline>
        <source src="Amazing_Video_With_VFX_and_Music.mp4" type="video/mp4">
    </video>

    <div id="vignette"></div>
    <div id="flash"></div>

    <div id="ui-layer">
        <h1 style="color: white; font-size: 1rem; letter-spacing: 3px; margin-bottom: 2rem; opacity: 0.7;">Experience
            the Void</h1>
        <button id="start-btn">Enter Interaction</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <!-- Shaders -->
    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
            gl_PointSize = size * ( 300.0 / -mvPosition.z );
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform vec3 color;
        uniform sampler2D pointTexture;
        varying vec3 vColor;
        void main() {
            gl_FragColor = vec4( color * vColor, 1.0 );
            gl_FragColor = gl_FragColor * texture2D( pointTexture, gl_PointCoord );
        }
    </script>

    <!-- God Ray Shader -->
    <script type="x-shader/x-vertex" id="volumetricVertex">
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script type="x-shader/x-fragment" id="volumetricFragment">
        uniform vec3 color;
        uniform float attenuation;
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        void main() {
            float alpha = smoothstep(0.0, 1.0, (vWorldPosition.y + 500.0) / 1000.0); 
            gl_FragColor = vec4(color, alpha * attenuation);
        }
    </script>

    <script>
        const config = {
            bloomStrength: 0.5,
            bloomRadius: 0.5,
            bloomThreshold: 0.8,
            audioSensitivity: 1.0
        };

        let state = {
            phase: 0,
            time: 0,
            shakeIntensity: 0,
            shivaZ: 0
        };

        const scene = new THREE.Scene();

        // Video Background Strategy
        const videoElement = document.getElementById('bg-video');
        if (videoElement) {
            const videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.format = THREE.RGBFormat;
            scene.background = videoTexture;
        }

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.z = 1000;

        const renderer = new THREE.WebGLRenderer({ antialias: true }); // Alpha not strictly needed if we have background
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = config.bloomThreshold;
        bloomPass.strength = config.bloomStrength;
        bloomPass.radius = config.bloomRadius;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Textures ---
        function getSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, 'rgba(240,240,240,1)');
            grad.addColorStop(0.5, 'rgba(200,200,200,0.5)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.Texture(canvas);
        }
        const particleSprite = getSprite();
        particleSprite.needsUpdate = true;

        // --- Assets ---
        let embers, cosmicDust, shockwaveBlue, shockwaveGold, shivaForm, blessingParticles, crackMesh, godRays, sparks;
        const particleGroups = [];

        // --- 1. THE CRACK ---
        function createCrack() {
            const points = [];
            let y = 600;
            points.push(new THREE.Vector3(0, y, -500));
            while (y > -200) {
                y -= 20 + Math.random() * 30;
                points.push(new THREE.Vector3((Math.random() - 0.5) * 50, y, -500));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xffd700, linewidth: 2, opacity: 0, transparent: true });
            crackMesh = new THREE.Line(geometry, material);
            scene.add(crackMesh);
        }
        // createCrack(); // Disabled for cleaner video view

        // --- 2. PARTICLES ---
        function createParticles(count, color, sizeBase) {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const colorObj = new THREE.Color(color);

            for (let i = 0; i < count; i++) {
                const x = (Math.random() * 2 - 1) * 1200;
                const y = (Math.random() * 2 - 1) * 1200;
                const z = (Math.random() * 2 - 1) * 1200;
                positions.push(x, y, z);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
                sizes.push(sizeBase * Math.random());
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: particleSprite }
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
            return { mesh: particles, originalPositions: positions };
        }

        embers = createParticles(1500, 0xffaa00, 20);
        cosmicDust = createParticles(2000, 0x4444ff, 10);
        particleGroups.push(embers, cosmicDust);

        // --- 3. SHIVA FORM ---
        function createShivaForm() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];

            const lightColor = new THREE.Color(0x00ffff);
            const ashColor = new THREE.Color(0xaaaaaa);

            const count = 10000;
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const h = Math.random() * 250;
                let r = 0;
                if (h < 50) r = 80;
                else if (h < 150) r = 40 + Math.sin(h) * 10;
                else r = 30;
                r += (Math.random() - 0.5) * 10;

                const x = r * Math.cos(theta);
                const y = h - 120;
                const z = r * Math.sin(theta);

                positions.push(x, y, z);

                if (Math.random() > 0.7) {
                    colors.push(lightColor.r, lightColor.g, lightColor.b);
                } else {
                    colors.push(ashColor.r, ashColor.g, ashColor.b);
                }

                sizes.push(3 + Math.random() * 8);
            }

            for (let i = 0; i < 2000; i++) {
                const y = (Math.random() * 500) - 100;
                const x = (Math.random() - 0.5) * 10;
                const z = (Math.random() - 0.5) * 10;
                positions.push(x + 100, y, z);
                colors.push(1, 0.8, 0.2);
                sizes.push(10);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: particleSprite }
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0
            });

            shivaForm = new THREE.Points(geometry, material);
            shivaForm.material.opacity = 0;
            shivaForm.position.z = -400;
            scene.add(shivaForm);
        }
        // createShivaForm(); // Disabled for cleaner video view

        // --- 4. BLESSING PARTICLES ---
        function createBlessingParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            for (let i = 0; i < 1000; i++) {
                positions.push(0, 0, -200);
                colors.push(1, 0.8, 0.2);
                sizes.push(Math.random() * 30);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            const mat = new THREE.ShaderMaterial({
                uniforms: { color: { value: new THREE.Color(0xffffff) }, pointTexture: { value: particleSprite } },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending, depthTest: false, transparent: true, opacity: 0
            });
            blessingParticles = new THREE.Points(geometry, mat);
            scene.add(blessingParticles);
            blessingParticles.userData = { velocities: [] };
            for (let i = 0; i < 1000; i++) {
                blessingParticles.userData.velocities.push({
                    x: (Math.random() - 0.5) * 5,
                    y: (Math.random() - 0.5) * 5,
                    z: Math.random() * 20 + 5
                });
            }
        }
        createBlessingParticles();

        // --- 5. SPARKS ---
        function createSparks() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];
            const colors = [];

            for (let i = 0; i < 500; i++) {
                positions.push(100, -100, -400);
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 20 + 10;
                velocities.push(Math.cos(angle) * speed, Math.random() * 20, Math.sin(angle) * speed);
                colors.push(1, 0.9, 0.5);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ size: 5, vertexColors: true, blending: THREE.AdditiveBlending });
            sparks = new THREE.Points(geometry, material);
            sparks.userData = { velocities: velocities, active: false };
            sparks.visible = false;
            scene.add(sparks);
        }
        createSparks();

        // --- 6. SHIVA GOD IMAGE (Divine Descent) ---
        let shivaGodMesh;
        function createShivaGod() {
            const loader = new THREE.TextureLoader();
            // Using the new Cinematic Blessing image
            loader.load('shiva_blessing_cinematic.png', (texture) => {
                const geometry = new THREE.PlaneGeometry(400, 400); // Increased size for better impact
                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending // Additive blending for "glowing" look
                });
                shivaGodMesh = new THREE.Mesh(geometry, material);
                shivaGodMesh.position.set(0, 1000, -300); // Start high up
                scene.add(shivaGodMesh);
            }, undefined, (err) => console.error("Error loading Shiva image:", err));
        }
        createShivaGod();

        // createGodRays(); // Disabled for cleaner video view

        // --- 7. AUDIO (Robust) ---
        let audioContext, analyser, dataArray;

        function initAudio() {
            const safeStart = () => {
                console.log("Safe starting timeline");
                if (state.phase === 0) startTimeline();
            };

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) {
                    safeStart();
                    return;
                }

                audioContext = new AudioContext();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const audioEl = new Audio('shiva_mantra.mp3');
                audioEl.crossOrigin = "anonymous";
                audioEl.loop = true;

                audioEl.addEventListener('error', (e) => {
                    console.warn("Audio Element Error", e);
                    safeStart();
                });

                try {
                    const source = audioContext.createMediaElementSource(audioEl);
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                } catch (err) {
                    console.warn("CORS/Source Error", err);
                }

                const p = audioEl.play();
                if (p !== undefined) {
                    p.then(() => {
                        safeStart();
                    }).catch(e => {
                        safeStart();
                    });
                } else {
                    safeStart();
                }

            } catch (e) {
                console.error("Audio Fatal", e);
                // Ensure we still start the visual experience
                safeStart();
            }
        }

        // --- 8. TIMELINE ---
        function startTimeline() {
            state.phase = 1;

            setTimeout(() => {
                state.phase = 2;
                state.shakeIntensity = 5;
            }, 3000);

            setTimeout(() => {
                state.phase = 3;
                triggerImpact();
            }, 6000);

            setTimeout(() => {
                state.phase = 4;
            }, 7000);
        }

        function triggerImpact() {
            const flash = document.getElementById('flash');
            flash.style.opacity = 1;
            setTimeout(() => { flash.style.opacity = 0; }, 150);

            // Removing central VFX as requested
            /*
            const geo1 = new THREE.TorusGeometry(10, 5, 16, 100);
            ...
            scene.add(shockwaveBlue);

            sparks.visible = true;
            sparks.userData.active = true;
            */
        }


        // --- 9. ANIMATION LOOP ---
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector2();
        document.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('ui-layer').classList.add('fade-out');
            // Play video on start
            const video = document.getElementById('bg-video');
            if (video) {
                video.play().catch(e => console.warn("Video Play Error", e));
                video.muted = false;
            }
            initAudio();
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                config.audioSensitivity = 1 + (avg / 128);
            } else {
                config.audioSensitivity = 1 + Math.sin(time * 2) * 0.2;
            }

            const targetX = mouse.x * 30;
            const targetY = mouse.y * 30;
            if (state.phase === 2 || state.phase === 3) {
                camera.position.x = targetX + (Math.random() - 0.5) * state.shakeIntensity;
                camera.position.y = targetY + (Math.random() - 0.5) * state.shakeIntensity;
            } else {
                camera.position.x += (targetX - camera.position.x) * 0.05;
                camera.position.y += (targetY - camera.position.y) * 0.05;
            }
            camera.lookAt(0, 0, -400);

            // Disable Crack for cleaner video view
            // if (state.phase === 2 && crackMesh) {
            //     crackMesh.material.opacity = Math.min(1, crackMesh.material.opacity + delta);
            //     crackMesh.scale.x = 1 + Math.random() * 0.1; 
            // }

            // Disable Shockwaves
            // if (shockwaveGold) {
            //     shockwaveGold.scale.multiplyScalar(1 + (3 * delta));
            //     shockwaveGold.material.opacity -= delta * 0.5;
            // }
            // if (shockwaveBlue) {
            //     shockwaveBlue.scale.multiplyScalar(1 + (2 * delta)); 
            //     shockwaveBlue.material.opacity -= delta * 0.3;
            // }

            // Disable Sparks
            // if (sparks && sparks.userData.active) {
            //     ...
            // }

            if (sparks && sparks.userData.active) {
                const pos = sparks.geometry.attributes.position.array;
                const vels = sparks.userData.velocities;
                for (let i = 0; i < vels.length; i += 3) {
                    pos[i] += vels[i / 3 * 3] * delta * 10;
                    pos[i + 1] += vels[i / 3 * 3 + 1] * delta * 10;
                    pos[i + 2] += vels[i / 3 * 3 + 2] * delta * 10;
                    vels[i / 3 * 3 + 1] -= 9.8 * delta;
                }
                sparks.geometry.attributes.position.needsUpdate = true;
                sparks.material.opacity -= delta * 0.5;
            }

            if (state.phase >= 4) {
                // Animate Divine Descent
                if (shivaGodMesh) {
                    // Smooth descent to center (y=0)
                    shivaGodMesh.position.y += (0 - shivaGodMesh.position.y) * 0.02;
                    // Fade in
                    if (shivaGodMesh.material.opacity < 1) shivaGodMesh.material.opacity += delta * 0.5;

                    // Gentle hover effect
                    shivaGodMesh.position.y += Math.sin(time) * 0.5;

                    // Pulsating Aura Effect (Scale pulse)
                    const pulse = 1 + Math.sin(time * 2) * 0.05;
                    shivaGodMesh.scale.set(pulse, pulse, 1);
                }

                bloomPass.strength = config.bloomStrength * config.audioSensitivity + Math.sin(time) * 0.2;

                if (blessingParticles && shivaGodMesh) {
                    blessingParticles.material.opacity = shivaGodMesh.material.opacity;
                    const bPos = blessingParticles.geometry.attributes.position.array;
                    const bVels = blessingParticles.userData.velocities;

                    for (let i = 0; i < bVels.length; i++) {
                        // Slow motion magical particles
                        bPos[i * 3] += bVels[i].x * config.audioSensitivity * 0.5; // Slower x
                        bPos[i * 3 + 1] += bVels[i].y * config.audioSensitivity * 0.5; // Slower y
                        bPos[i * 3 + 2] += bVels[i].z * config.audioSensitivity * 1.5; // Forward movement

                        // Respawn at Shiva's hand/base (approximate)
                        if (bPos[i * 3 + 2] > 500) {
                            bPos[i * 3] = shivaGodMesh.position.x + (Math.random() - 0.5) * 100;
                            bPos[i * 3 + 1] = shivaGodMesh.position.y - 50 + (Math.random() - 0.5) * 50;
                            bPos[i * 3 + 2] = shivaGodMesh.position.z;
                        }
                    }
                    blessingParticles.geometry.attributes.position.needsUpdate = true;
                }
            }

            particleGroups.forEach(g => {
                g.mesh.rotation.y = time * 0.02;
            });

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
