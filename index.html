<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maha Shivratri - immersive Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        :root {
            --primary-glow: #ffd700;
            --secondary-glow: #ffffff;
            --deep-space: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--deep-space);
            color: white;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Cosmic Background */
        #cosmos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radical-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Main Container */
        .container {
            text-align: center;
            z-index: 10;
            transition: all 1.5s ease-in-out;
        }

        /* Pulsing Button */
        .om-button {
            background: transparent;
            border: 2px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 20px 40px;
            font-size: 2rem;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            animation: pulse 2s infinite;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .om-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: 0.5s;
        }

        .om-button:hover::before {
            left: 100%;
        }

        .om-button:hover {
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* Hidden Content (Carousel) */
        .hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateY(50px) scale(0.9);
            transition: all 1s ease;
        }

        .visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .carousel-container {
            width: 80vw;
            max-width: 1000px;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            position: relative;
        }
        
        /* 3D Tilt Card */
        .shiva-card {
            width: 300px;
            height: 450px;
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .shiva-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            border-radius: 20px;
        }

        .card-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            transform: translateZ(50px);
            text-align: left;
            z-index: 2;
        }

        .card-content h2 {
            font-size: 1.5rem;
            color: var(--primary-glow);
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-content p {
            font-size: 0.9rem;
            color: #ddd;
        }

        /* Navigation */
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 50%;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            margin: 0 20px;
        }

        .nav-btn:hover {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .om-button {
                font-size: 1.5rem;
                padding: 15px 30px;
            }
            .shiva-card {
                width: 260px;
                height: 380px;
            }
        }
    </style>
</head>
<body>

    <!-- Cosmic Background Canvas -->
    <canvas id="cosmos"></canvas>

    <!-- Initial State: Button -->
    <div id="intro" class="container">
        <button id="omBtn" class="om-button">Om Namah Shivaya</button>
    </div>

    <!-- Hidden State: Carousel -->
    <div id="gallery" class="container hidden">
        <div class="carousel-container">
            <button class="nav-btn" id="prevBtn">&#10094;</button>
            
            <div class="shiva-card" id="card">
                <div class="card-content">
                    <h2 id="cardTitle">The Cosmic Dancer</h2>
                    <p id="cardDesc">Nataraja - The source of all movement within the cosmos.</p>
                </div>
            </div>

            <button class="nav-btn" id="nextBtn">&#10095;</button>
        </div>
        
        <!-- Audio Player (Hidden visual, accessible via JS) -->
        <audio id="mantraAudio" loop>
            <!-- User to add their own audio source here -->
            <source src="shiva_mantra.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // --- Cosmic Background ---
        const canvas = document.getElementById('cosmos');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const starCount = Math.floor((width * height) / 800);
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    opacity: Math.random(),
                    speed: Math.random() * 0.05 + 0.01
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Nebulous Gradient Background (Simulated)
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#020014');
            gradient.addColorStop(1, '#090a1f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Twinkle effect
                star.opacity += (Math.random() - 0.5) * 0.1;
                if (star.opacity < 0) star.opacity = 0;
                if (star.opacity > 1) star.opacity = 1;

                // Subtle movement
                star.y -= star.speed;
                if (star.y < 0) star.y = height;
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resize);
        resize();
        drawStars();

        // --- Interaction Logic ---
        const omBtn = document.getElementById('omBtn');
        const intro = document.getElementById('intro');
        const gallery = document.getElementById('gallery');
        const audio = document.getElementById('mantraAudio');

        omBtn.addEventListener('click', () => {
             // 1. Confetti Explosion (Gold & White)
             const duration = 3000;
             const end = Date.now() + duration;

             (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffd700', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffd700', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
             }());

             // Big Burst
             confetti({
                 particleCount: 150,
                 spread: 70,
                 origin: { y: 0.6 },
                 colors: ['#ffd700', '#ffffff']
             });

             // 2. Play Audio
             // Note: Most browsers require user interaction to play audio. 
             // We are inside a click handler, so it should work.
             audio.play().catch(err => {
                 console.log("Audio playback failed (likely no file or policy blocked):", err);
                 // alert("Please add 'shiva_mantra.mp3' to the folder for audio.");
             });

             // 3. Transition to Gallery
             intro.classList.add('hidden');
             setTimeout(() => {
                 intro.style.display = 'none';
                 gallery.classList.remove('hidden');
                 gallery.classList.add('visible');
             }, 1000);
        });

        // --- Carousel & 3D Tilt ---
        const card = document.getElementById('card');
        const cardTitle = document.getElementById('cardTitle');
        const cardDesc = document.getElementById('cardDesc');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // Placeholder Data - User should replace URLs
        const shivaImages = [
            {
                url: 'https://images.unsplash.com/photo-1620325497257-2e21019a1860?q=80&w=1000&auto=format&fit=crop', // Example Cosmic/Generic
                title: "The Cosmic Dancer",
                desc: "Nataraja - The source of all movement within the cosmos."
            },
            {
                url: 'https://images.unsplash.com/photo-1599827416345-2f9a7245b73d?q=80&w=1000&auto=format&fit=crop', // Example Statue
                title: "The Adiyogi",
                desc: "The first yogi, transmitting the science of Yoga."
            },
            {
                url: 'https://images.unsplash.com/photo-1544158462-8e100808a09f?q=80&w=1000&auto=format&fit=crop', // Example Light
                title: "Mahadev",
                desc: "The Great God, beyond time and space."
            }
        ];

        let currentIndex = 0;

        function updateCard() {
            // Add a fade out/in effect
            card.style.opacity = 0;
            setTimeout(() => {
                card.style.backgroundImage = `url('${shivaImages[currentIndex].url}')`;
                cardTitle.textContent = shivaImages[currentIndex].title;
                cardDesc.textContent = shivaImages[currentIndex].desc;
                card.style.opacity = 1;
            }, 200);
        }

        // Initialize First Card
        updateCard();

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % shivaImages.length;
            updateCard();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + shivaImages.length) % shivaImages.length;
            updateCard();
        });

        // 3D Tilt Effect
        document.addEventListener('mousemove', (e) => {
            // Apply only if gallery is visible
            if(!gallery.classList.contains('visible')) return;

            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset tilt when mouse leaves
        document.addEventListener('mouseleave', () => {
             card.style.transform = `rotateY(0deg) rotateX(0deg)`;
             card.style.transition = 'all 0.5s ease';
        });

        card.addEventListener('mouseenter', () => {
            card.style.transition = 'none'; // Remove transition for responsiveness during hover
        });
    </script>
</body>
</html>
