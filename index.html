<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maha Shivratri: The Divine Descent</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Cinzel', serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #start-btn {
            pointer-events: auto;
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 15px 40px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.5s;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        #start-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transform: scale(1.1);
        }

        .fade-out {
            opacity: 0;
            transition: opacity 2s ease-out;
            pointer-events: none !important;
        }

        /* Vignette Overlay */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, black 100%);
            z-index: 5;
            pointer-events: none;
        }

        /* Flash Effect */
        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }
    </style>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="vignette"></div>
    <div id="flash"></div>

    <div id="ui-layer">
        <h1 style="color: white; font-size: 1rem; letter-spacing: 3px; margin-bottom: 2rem; opacity: 0.7;">Experience
            the Void</h1>
        <button id="start-btn">Enter Interaction</button>
    </div>

    <!-- Three.js & Post Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

    <!-- Custom Particle Shaders -->
    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
            gl_PointSize = size * ( 300.0 / -mvPosition.z );
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform vec3 color;
        uniform sampler2D pointTexture;
        varying vec3 vColor;
        void main() {
            gl_FragColor = vec4( color * vColor, 1.0 );
            gl_FragColor = gl_FragColor * texture2D( pointTexture, gl_PointCoord );
        }
    </script>

    <script>
        // --- 1. CONFIG & STATE ---
        const config = {
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0,
            audioSensitivity: 1.0 // will be modulated
        };

        let state = {
            phase: 0, // 0: Start, 1: Void, 2: Disturbance, 3: Impact, 4: Reveal
            time: 0,
            shakeIntensity: 0
        };

        // --- 2. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.z = 1000;

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- 3. POST PROCESSING (BLOOM) ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = config.bloomThreshold;
        bloomPass.strength = config.bloomStrength;
        bloomPass.radius = config.bloomRadius;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 4. PARTICLE SYSTEMS ---

        // Helper to create texture
        function getSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, 'rgba(240,240,240,1)');
            grad.addColorStop(0.5, 'rgba(200,200,200,0.5)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const particleSprite = getSprite();

        // SYSTEMS
        let embers, cosmicDust, shockwave, shivaForm;
        const particleGroups = [];

        function createParticles(count, color, sizeBase, type) {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const colorObj = new THREE.Color(color);

            for (let i = 0; i < count; i++) {
                // Random position in a sphere/cube
                const x = (Math.random() * 2 - 1) * 1000;
                const y = (Math.random() * 2 - 1) * 1000;
                const z = (Math.random() * 2 - 1) * 1000;
                positions.push(x, y, z);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
                sizes.push(sizeBase * Math.random());
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: particleSprite }
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            return { mesh: particles, type: type, originalPositions: positions, speeds: [] };
        }

        // Initialize Systems
        embers = createParticles(2000, 0xffaa00, 20, 'embers');     // Gold
        cosmicDust = createParticles(3000, 0x4444ff, 10, 'dust');   // Blue
        particleGroups.push(embers, cosmicDust);

        // Trishul / Shiva Form Geometry (Procedural Representation)
        function createShivaForm() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const colorObj = new THREE.Color(0x00ffff); // Cyan/White divine light

            // Create a vague silhouette of a seated figure + Trident
            const count = 5000;
            for (let i = 0; i < count; i++) {
                // Cylindrical coords for body
                const theta = Math.random() * Math.PI * 2;
                const h = Math.random() * 200; // height
                const r = 20 + Math.random() * 20 * Math.sin(h / 200 * Math.PI); // rough body shape

                const x = r * Math.cos(theta);
                const y = h - 100; // Center vertically
                const z = r * Math.sin(theta);

                positions.push(x, y, z);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
                sizes.push(5 + Math.random() * 10);
            }

            // Trident (Stick + Prongs)
            for (let i = 0; i < 1000; i++) {
                const y = (Math.random() * 400) - 100;
                const x = (Math.random() - 0.5) * 10;
                const z = (Math.random() - 0.5) * 10;
                positions.push(x + 100, y, z); // Offset trident
                colors.push(1, 0.8, 0); // Gold
                sizes.push(15);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: particleSprite }
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0 // Start invisible
            });

            shivaForm = new THREE.Points(geometry, material);
            shivaForm.material.opacity = 0; // Ensure invisible start
            shivaForm.visible = false;
            scene.add(shivaForm);
        }

        createShivaForm();


        // --- 5. AUDIO SYSTEM ---
        let audioContext, analyser, dataArray;
        let audioLevel = 0;

        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            // Simple Oscillator drone for "Om" if no file, but user requested file.
            // We will attempt to load file, fall back to oscillator if interaction allows.

            const audioEl = new Audio('shiva_mantra.mp3'); // Try to load
            audioEl.crossOrigin = "anonymous";
            audioEl.loop = true;

            const source = audioContext.createMediaElementSource(audioEl);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            audioEl.play().then(() => {
                console.log("Audio playing");
                startTimeline();
            }).catch(e => {
                console.warn("Audio play failed, starting silent timeline:", e);
                startTimeline(true); // silent mode
            });
        }

        // --- 6. NARRATIVE TIMELINE ---
        function startTimeline(silent) {
            state.phase = 1; // VOID
            const startTime = Date.now();

            // Phase 2: DISTURBANCE starts at 3s
            setTimeout(() => {
                state.phase = 2;
                state.shakeIntensity = 5;
            }, 3000);

            // Phase 3: IMPACT at 6s
            setTimeout(() => {
                state.phase = 3;
                triggerImpact();
            }, 6000);

            // Phase 4: REVEAL at 7s
            setTimeout(() => {
                state.phase = 4;
                revealShiva();
            }, 7000);
        }

        function triggerImpact() {
            // Flash Screen
            const flash = document.getElementById('flash');
            flash.style.opacity = 1;
            setTimeout(() => { flash.style.opacity = 0; }, 200);

            // Create Shockwave Ring
            const geometry = new THREE.TorusGeometry(10, 5, 16, 100);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            shockwave = new THREE.Mesh(geometry, material);
            shockwave.rotation.x = Math.PI / 2;
            scene.add(shockwave);
        }

        function revealShiva() {
            shivaForm.visible = true;
            // Animate opacity in render loop via uniform or property
        }


        // --- 7. INTERACTION ---
        const mouse = new THREE.Vector2();

        document.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        document.addEventListener('touchmove', (event) => {
            if (event.touches.length > 0) {
                mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        });

        // Damru Ripple on click
        document.addEventListener('click', () => {
            if (state.phase >= 4) {
                // Pulse effect in revealed state
                bloomPass.strength = 3.0;
                setTimeout(() => { bloomPass.strength = config.bloomStrength; }, 300);
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('ui-layer').classList.add('fade-out');
            initAudio(); // Start Audio Context
        });


        // --- 8. RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Audio Analysis
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                config.audioSensitivity = 1 + (avg / 128); // 1.0 to 3.0 approx
            }

            // 1. Camera Movement (Parallax + Shake)
            const baseCamX = mouse.x * 50;
            const baseCamY = mouse.y * 50;

            if (state.phase === 2) {
                // Shake
                camera.position.x = baseCamX + (Math.random() - 0.5) * state.shakeIntensity;
                camera.position.y = baseCamY + (Math.random() - 0.5) * state.shakeIntensity;
            } else {
                // Smooth Lerp
                camera.position.x += (baseCamX - camera.position.x) * 0.05;
                camera.position.y += (baseCamY - camera.position.y) * 0.05;
            }
            camera.lookAt(scene.position);


            // 2. Particle Animation
            particleGroups.forEach(group => {
                const positions = group.mesh.geometry.attributes.position.array;

                for (let i = 0; i < positions.length; i += 3) {
                    // Start Position restoration logic could go here
                    // Simple flow:
                    positions[i + 1] += (0.5 * config.audioSensitivity); // Move up

                    // Reset if out of bounds
                    if (positions[i + 1] > 1000) positions[i + 1] = -1000;

                    // Mouse Interaction (Repel)
                    if (state.phase >= 4) {
                        // Logic to swirl particles?
                    }
                }
                group.mesh.geometry.attributes.position.needsUpdate = true;
                group.mesh.rotation.y = time * 0.05; // Rotate whole system
            });


            // 3. Phase Logic
            if (state.phase === 3 && shockwave) {
                shockwave.scale.x += 20 * delta;
                shockwave.scale.y += 20 * delta;
                shockwave.material.opacity -= 1 * delta;
                if (shockwave.material.opacity <= 0) {
                    scene.remove(shockwave);
                    shockwave = null;
                }
            }

            if (state.phase === 4 && shivaForm) {
                shivaForm.rotation.y += 0.02 * delta;
                // Pulse size
                const scale = 1 + Math.sin(time * 2) * 0.05 * config.audioSensitivity;
                shivaForm.scale.set(scale, scale, scale);

                // Fade in
                if (shivaForm.material.opacity < 0.8) shivaForm.material.opacity += 0.01;
            }

            // Bloom Pulse with Audio
            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, config.bloomStrength * config.audioSensitivity, 0.1);

            composer.render();
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>

</html>
