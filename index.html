<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maha Shivratri: The Divine Descent</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Cinzel', serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 2s ease-out;
        }

        #start-btn {
            pointer-events: auto;
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 15px 40px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.5s;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        #start-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transform: scale(1.1);
        }

        .fade-out {
            opacity: 0;
            pointer-events: none !important;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, black 100%);
            z-index: 5;
            pointer-events: none;
        }

        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="vignette"></div>
    <div id="flash"></div>

    <div id="ui-layer">
        <h1 style="color: white; font-size: 1rem; letter-spacing: 3px; margin-bottom: 2rem; opacity: 0.7;">Experience
            the Void</h1>
        <button id="start-btn">Enter Interaction</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
            gl_PointSize = size * ( 300.0 / -mvPosition.z );
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform vec3 color;
        uniform sampler2D pointTexture;
        varying vec3 vColor;
        void main() {
            gl_FragColor = vec4( color * vColor, 1.0 );
            gl_FragColor = gl_FragColor * texture2D( pointTexture, gl_PointCoord );
        }
    </script>

    <script>
        const config = {
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0,
            audioSensitivity: 1.0
        };

        // State
        let state = {
            phase: 0,
            time: 0,
            shakeIntensity: 0,
            shivaZ: 0 // New: Track Shiva's forward movement
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.z = 1000;

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = config.bloomThreshold;
        bloomPass.strength = config.bloomStrength;
        bloomPass.radius = config.bloomRadius;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        function getSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, 'rgba(240,240,240,1)');
            grad.addColorStop(0.5, 'rgba(200,200,200,0.5)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.Texture(canvas);
        }

        const particleSprite = getSprite();
        particleSprite.needsUpdate = true;

        let embers, cosmicDust, shockwave, shivaForm, blessingParticles;
        const particleGroups = [];

        function createParticles(count, color, sizeBase, type) {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const colorObj = new THREE.Color(color);

            for (let i = 0; i < count; i++) {
                const x = (Math.random() * 2 - 1) * 1000;
                const y = (Math.random() * 2 - 1) * 1000;
                const z = (Math.random() * 2 - 1) * 1000;
                positions.push(x, y, z);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
                sizes.push(sizeBase * Math.random());
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: particleSprite }
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            return { mesh: particles, type: type, originalPositions: positions };
        }

        embers = createParticles(2000, 0xffaa00, 20, 'embers');
        cosmicDust = createParticles(3000, 0x4444ff, 10, 'dust');
        particleGroups.push(embers, cosmicDust);

        function createShivaForm() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            // Cyan/White glow
            const colorObj = new THREE.Color(0x00ffff);

            const count = 7000;
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const h = Math.random() * 200;
                const r = 20 + Math.random() * 25 * Math.sin(h / 200 * Math.PI); // Body shape

                const x = r * Math.cos(theta);
                const y = h - 100;
                const z = r * Math.sin(theta);

                positions.push(x, y, z);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
                sizes.push(5 + Math.random() * 10);
            }

            // Trident
            for (let i = 0; i < 1500; i++) {
                const y = (Math.random() * 450) - 100;
                const x = (Math.random() - 0.5) * 15;
                const z = (Math.random() - 0.5) * 15;
                positions.push(x + 120, y, z);
                colors.push(1, 0.9, 0.2); // Gold
                sizes.push(15);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: particleSprite }
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0
            });

            shivaForm = new THREE.Points(geometry, material);
            shivaForm.material.opacity = 0;
            // Start further back
            shivaForm.position.z = -500;
            scene.add(shivaForm);
        }

        createShivaForm();

        // Blessing Stream
        function createBlessingParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            const count = 1000;

            for (let i = 0; i < count; i++) {
                // Emit from approx hand position
                positions.push(0, 0, -200);
                colors.push(1, 0.8, 0.2); // Golden
                sizes.push(Math.random() * 30);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffffff) },
                    pointTexture: { value: particleSprite }
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0
            });

            blessingParticles = new THREE.Points(geometry, material);
            scene.add(blessingParticles);
            // Storing velocities in userData for simplicity
            blessingParticles.userData = { velocities: [] };
            for (let i = 0; i < count; i++) {
                blessingParticles.userData.velocities.push({
                    x: (Math.random() - 0.5) * 5,
                    y: (Math.random() - 0.5) * 5,
                    z: Math.random() * 20 + 5
                });
            }
        }
        createBlessingParticles();


        let audioContext, analyser, dataArray;

        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            const audioEl = new Audio('shiva_mantra.mp3');
            audioEl.crossOrigin = "anonymous";
            audioEl.loop = true;

            const source = audioContext.createMediaElementSource(audioEl);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            audioEl.play().then(() => {
                startTimeline();
            }).catch(e => {
                console.warn(e);
                startTimeline(true);
            });
        }

        function startTimeline(silent) {
            state.phase = 1;

            setTimeout(() => {
                state.phase = 2;
                state.shakeIntensity = 5;
            }, 3000);

            setTimeout(() => {
                state.phase = 3;
                triggerImpact();
            }, 6000);

            setTimeout(() => {
                state.phase = 4;
                revealShiva();
            }, 7000);
        }

        function triggerImpact() {
            const flash = document.getElementById('flash');
            flash.style.opacity = 1;
            setTimeout(() => { flash.style.opacity = 0; }, 200);

            const geometry = new THREE.TorusGeometry(10, 5, 16, 100);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            shockwave = new THREE.Mesh(geometry, material);
            shockwave.rotation.x = Math.PI / 2;
            scene.add(shockwave);
        }

        function revealShiva() {
            // Logic handled in animate loop
        }

        const mouse = new THREE.Vector2();
        document.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('ui-layer').classList.add('fade-out');
            initAudio();
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                config.audioSensitivity = 1 + (avg / 128);
            }

            const baseCamX = mouse.x * 50;
            const baseCamY = mouse.y * 50;

            if (state.phase === 2) {
                camera.position.x = baseCamX + (Math.random() - 0.5) * state.shakeIntensity;
                camera.position.y = baseCamY + (Math.random() - 0.5) * state.shakeIntensity;
            } else {
                camera.position.x += (baseCamX - camera.position.x) * 0.05;
                camera.position.y += (baseCamY - camera.position.y) * 0.05;
            }
            camera.lookAt(scene.position);

            particleGroups.forEach(group => {
                const positions = group.mesh.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] += (0.5 * config.audioSensitivity);
                    if (positions[i + 1] > 1000) positions[i + 1] = -1000;
                }
                group.mesh.geometry.attributes.position.needsUpdate = true;
                group.mesh.rotation.y = time * 0.05;
            });

            if (state.phase === 3 && shockwave) {
                shockwave.scale.x += 20 * delta;
                shockwave.scale.y += 20 * delta;
                shockwave.material.opacity -= 1 * delta;
                if (shockwave.material.opacity <= 0) {
                    scene.remove(shockwave);
                    shockwave = null;
                }
            }

            // Phase 4: Reveal, Approach, and Bless
            if (state.phase === 4 && shivaForm) {
                shivaForm.visible = true;

                // 1. Movement: Approach camera (from -500 to 0)
                if (shivaForm.position.z < 0) {
                    shivaForm.position.z += 100 * delta; // Speed of approach
                }

                // 2. Pulse & Rotate
                const scale = 1 + Math.sin(time * 2) * 0.05 * config.audioSensitivity;
                shivaForm.scale.set(scale, scale, scale);
                shivaForm.rotation.y += 0.01 * delta;

                // 3. Fade in
                if (shivaForm.material.opacity < 1.0) shivaForm.material.opacity += 0.02;

                // 4. Blessing Particles
                if (blessingParticles) {
                    blessingParticles.material.opacity = shivaForm.material.opacity;
                    const bPos = blessingParticles.geometry.attributes.position.array;
                    const bVels = blessingParticles.userData.velocities;

                    for (let i = 0; i < bVels.length; i++) {
                        // Move Forward towards camera + spread
                        bPos[i * 3] += bVels[i].x * config.audioSensitivity;
                        bPos[i * 3 + 1] += bVels[i].y * config.audioSensitivity;
                        bPos[i * 3 + 2] += bVels[i].z * config.audioSensitivity * 2; // Fast forward

                        // Reset if passed camera
                        if (bPos[i * 3 + 2] > 1000) {
                            // Reset to Shiva's current position (approx)
                            bPos[i * 3] = shivaForm.position.x + (Math.random() - 0.5) * 50;
                            bPos[i * 3 + 1] = shivaForm.position.y + (Math.random() - 0.5) * 50;
                            bPos[i * 3 + 2] = shivaForm.position.z;
                        }
                    }
                    blessingParticles.geometry.attributes.position.needsUpdate = true;
                }
            }

            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, config.bloomStrength * config.audioSensitivity, 0.1);
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
